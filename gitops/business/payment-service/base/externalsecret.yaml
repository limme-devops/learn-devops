# Author: Mengty LIM
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        # The pod's ServiceAccount token is exchanged for a Vault token via
        # TokenReview. No secret is stored anywhere to make this work.
        kubernetes:
          mountPath: kubernetes
          role: payment-service
          serviceAccountRef:
            name: payment-service
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: payment-service-secrets
    creationPolicy: Owner
    deletionPolicy: Retain # do not delete a live secret if the CR is removed
    template:
      engineVersion: v2
      data:
        DB_USERNAME: "{{ .db_username }}"
        DB_PASSWORD: "{{ .db_password }}"
        DB_URL: "postgresql://payment-db-rw.data-postgres.svc:5432/payment?sslmode=verify-full"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        S3_ACCESS_KEY: "{{ .s3_access_key }}"
        S3_SECRET_KEY: "{{ .s3_secret_key }}"
  data:
    # Dynamic database credentials: Vault mints a fresh PostgreSQL user with a
    # 1h lease. There is no long-lived database password to steal or rotate.
    - secretKey: db_username
      remoteRef:
        key: database/creds/payment-service-readwrite
        property: username
    - secretKey: db_password
      remoteRef:
        key: database/creds/payment-service-readwrite
        property: password
    - secretKey: oidc_client_secret
      remoteRef:
        key: payments/payment-service
        property: oidc_client_secret
    - secretKey: s3_access_key
      remoteRef:
        key: payments/payment-service
        property: s3_access_key
    - secretKey: s3_secret_key
      remoteRef:
        key: payments/payment-service
        property: s3_secret_key
