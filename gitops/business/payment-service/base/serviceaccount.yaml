---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  annotations:
    # Bound to a Vault role that can issue payment-db credentials and nothing
    # else. The pod's identity IS its authorisation — no shared secret.
    vault.hashicorp.com/role: payment-service
# The app does not talk to the Kubernetes API, so it gets no token. If it is
# never mounted it can never be stolen.
automountServiceAccountToken: false
---
# Minimal Role. Present as a template — grant nothing until something actually
# needs it, then grant exactly that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payment-service
rules: []
  # Example of a legitimate grant (leader election), kept commented so it is a
  # deliberate act to enable:
  # - apiGroups: ["coordination.k8s.io"]
  #   resources: ["leases"]
  #   resourceNames: ["payment-service-leader"]
  #   verbs: ["get", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-service
subjects:
  - kind: ServiceAccount
    name: payment-service
roleRef:
  kind: Role
  name: payment-service
  apiGroup: rbac.authorization.k8s.io
