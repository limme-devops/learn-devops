# Author: Mengty LIM
---
# Argo Rollout instead of a Deployment: same pod spec, plus automated canary
# analysis and instant abort (docs/10-deployment-strategies.md §2).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-service
spec:
  replicas: 3
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service

  strategy:
    canary:
      canaryService: payment-service-canary
      stableService: payment-service-stable
      trafficRouting:
        nginx:
          stableIngress: payment-service
      # Keep the old ReplicaSet warm so an abort is instant rather than a
      # cold-start scramble.
      scaleDownDelaySeconds: 300
      maxSurge: "25%"
      maxUnavailable: 0

      analysis:
        templates:
          - templateName: payment-success-rate
          - templateName: payment-latency
        startingStep: 1
        args:
          - name: service-name
            value: payment-service-canary

      steps:
        - setWeight: 5
        - pause: { duration: 5m }
        - setWeight: 25
        - pause: { duration: 10m }
        - setWeight: 50
        - pause: { duration: 10m }
        - setWeight: 100

  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
      annotations:
        # Restart pods when non-secret config changes; secrets are reloaded by
        # the app on SIGHUP instead.
        checksum/config: "REPLACED_BY_OVERLAY"
    spec:
      serviceAccountName: payment-service
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Survive a node failure and a zone failure.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service

      # Graceful shutdown: the preStop sleep lets endpoint removal propagate
      # before the process stops accepting connections. Without it you get
      # intermittent 502s on every deploy.
      terminationGracePeriodSeconds: 60

      containers:
        - name: app
          image: payment-service # digest pinned by the overlay
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # No CPU limit on purpose: CFS throttling adds tail latency, and
              # the request already guarantees a floor. Memory IS limited,
              # because memory has no graceful degradation.
              memory: 1Gi

          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: OTEL_SERVICE_NAME
              value: payment-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=payments,deployment.environment=$(POD_NAMESPACE)"

          envFrom:
            - secretRef:
                name: payment-service-secrets # created by ExternalSecret from Vault
            - configMapRef:
                name: payment-service-config

          # Three distinct probes, three distinct jobs:
          #  startup   — "is it up yet?"  (tolerates slow boot without a long
          #              initialDelay on liveness)
          #  liveness  — "is the process wedged?"  (restart fixes it)
          #  readiness — "can it serve?"  (includes dependencies; removing it
          #              from endpoints fixes it, restarting does not)
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "15"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache

      # readOnlyRootFilesystem means every writable path must be declared.
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 256Mi

      # Data-class restricted workloads run on dedicated, tainted nodes.
      nodeSelector:
        workload-class: general
