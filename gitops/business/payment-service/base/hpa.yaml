# Author: Mengty LIM
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: payment-service
  minReplicas: 3
  maxReplicas: 20

  metrics:
    # Requests-per-pod is the honest signal for an IO-bound API. CPU is kept as
    # a secondary safety net, not the primary trigger — a service waiting on a
    # slow database shows low CPU while queueing badly.
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  behavior:
    scaleUp:
      # React fast to load, but not so fast that a metrics blip doubles the
      # fleet and stampedes the database with new connections.
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Scale down slowly. Aggressive scale-down during a traffic trough leaves
      # nothing warm when traffic returns.
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
      selectPolicy: Min
