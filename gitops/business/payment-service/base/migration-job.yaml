# Author: Mengty LIM
---
# Database migration as a PreSync hook: it runs to completion BEFORE the new
# pods start, exactly once per sync, not N times racing in N pod startups.
#
# Only expand-phase migrations belong here — additive, backwards-compatible
# changes that the currently-running version tolerates
# (docs/10-deployment-strategies.md §4). A contract-phase migration is a
# separate, later release.
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-service-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 1 # do not retry a failed migration repeatedly; stop and look
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400 # keep the logs for a day for post-hoc review

  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: payment-service
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: migrate
          image: payment-service # same digest as the app: migrations ship with the code
          command: ["/app/bin/migrate"]
          args:
            - "--direction=up"
            - "--phase=expand"
            # Fail fast rather than queue behind a lock and stall the database.
            - "--lock-timeout=5s"
            - "--statement-timeout=300s"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }

          envFrom:
            - secretRef:
                name: payment-service-secrets

          env:
            # Migrations use a DIFFERENT database role — one that may perform
            # DDL. The application's own role cannot alter the schema, which
            # limits what a compromised app pod can do to the data.
            - name: DB_MIGRATION_MODE
              value: "true"

      # The migration must be able to reach the database even though the app's
      # NetworkPolicy targets a different label set.
      nodeSelector:
        workload-class: general
