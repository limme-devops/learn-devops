---
# Reusable security stage. Include from any app pipeline:
#
#   include:
#     - project: platform/ci-templates
#       file: /templates/security.yml
#
# Gate order is deliberate: cheapest and fastest first, so developers get
# feedback in seconds rather than at the end of a ten-minute pipeline
# (docs/03-security-baseline.md §1).

.vault-auth: &vault-auth
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.bank.internal
  before_script:
    # Exchange the pipeline's short-lived OIDC token for a Vault token. There
    # are no long-lived credentials in CI variables — that is the whole point.
    - export VAULT_ADDR="https://vault.bank.internal:8200"
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=ci-${CI_PROJECT_NAME} jwt=$VAULT_ID_TOKEN)"
    - test -n "$VAULT_TOKEN" || { echo "Vault login failed"; exit 1; }

# --- 1. Secrets -------------------------------------------------------------
secrets-scan:
  stage: validate
  image: zricethezav/gitleaks:v8.18.4
  script:
    # On an MR, scan the FULL history of the branch: a secret that was
    # committed and then "removed" in a later commit is still in the history
    # and still compromised.
    - gitleaks detect --source=. --config=.gitleaks.toml --redact --verbose --exit-code 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- 2. SAST ----------------------------------------------------------------
sast:
  stage: validate
  image: returntocorp/semgrep:latest
  script:
    - semgrep ci --config=auto --config=p/security-audit --config=p/owasp-top-ten
        --sarif --output=semgrep.sarif --error
  artifacts:
    when: always
    reports:
      sast: semgrep.sarif
    expire_in: 30 days
  allow_failure: false

# --- 3. Dependencies --------------------------------------------------------
dependency-scan:
  stage: validate
  image: aquasec/trivy:latest
  script:
    # Critical always blocks. High blocks only when a fix exists — failing a
    # build over an unfixable CVE just teaches people to disable the gate.
    - trivy fs --scanners vuln,license --severity CRITICAL --exit-code 1 .
    - trivy fs --scanners vuln --severity HIGH --ignore-unfixed --exit-code 1 .
    - trivy fs --scanners vuln --format json --output deps.json .
  artifacts:
    paths: [deps.json]
    when: always

# --- 4. IaC -----------------------------------------------------------------
iac-scan:
  stage: validate
  image: bridgecrew/checkov:latest
  script:
    - checkov -d . --framework terraform,kubernetes,dockerfile,github_actions
        --compact --quiet --output cli --output junitxml --output-file-path console,checkov.xml
        --soft-fail-on LOW,MEDIUM
  artifacts:
    reports:
      junit: checkov.xml
    when: always
  rules:
    - changes: ["**/*.tf", "**/*.yaml", "**/*.yml", "**/Dockerfile"]

kubernetes-manifest-scan:
  stage: validate
  image: stackrox/kube-linter:latest
  script:
    - |
      for overlay in gitops/business/*/overlays/*; do
        echo "--> $overlay"
        kustomize build "$overlay" | kube-linter lint - --config .kube-linter.yaml
      done
  rules:
    - changes: ["gitops/**/*"]

# --- 5. Image scan + SBOM + signature --------------------------------------
image-scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed "$IMAGE_DIGEST"
    - trivy image --severity HIGH --format json --output image-high.json "$IMAGE_DIGEST"
    # A container that ships a shell, a package manager or curl gives an
    # attacker tooling for free. Distroless bases should have none of it.
    - |
      if trivy image --list-all-pkgs --format json "$IMAGE_DIGEST" \
         | jq -e '.Results[].Packages[]?.Name | select(. == "bash" or . == "curl" or . == "apt")' >/dev/null; then
        echo "WARNING: image ships shell/package tooling — prefer a distroless base"
      fi
  artifacts:
    paths: [image-high.json]
    when: always

generate-sbom:
  stage: scan
  image: anchore/syft:latest
  script:
    # The SBOM is what makes "which prod services ship this library?" a
    # two-minute question when the next log4shell lands.
    - syft "$IMAGE_DIGEST" -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
  artifacts:
    paths: [sbom.cdx.json, sbom.spdx.json]
    expire_in: 1 year   # retained for the life of the deployed artifact

sign-image:
  stage: sign
  image: gcr.io/projectsigstore/cosign:latest
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - cosign sign --yes --rekor-url https://rekor.bank.internal "$IMAGE_DIGEST"
    - cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$IMAGE_DIGEST"
    # Verify our own signature immediately. If verification fails here, the
    # Kyverno admission policy would reject the image at deploy time anyway —
    # better to find out now than during a release window.
    - |
      cosign verify \
        --certificate-identity-regexp "https://gitlab.bank.internal/${CI_PROJECT_PATH}" \
        --certificate-oidc-issuer "https://gitlab.bank.internal" \
        "$IMAGE_DIGEST"
  needs: [generate-sbom]

# --- 6. DAST (nightly against staging) --------------------------------------
dast:
  stage: verify
  image: ghcr.io/zaproxy/zaproxy:stable
  script:
    - zap-api-scan.py -t "$STAGING_OPENAPI_URL" -f openapi -r zap-report.html -I
  artifacts:
    paths: [zap-report.html]
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true   # findings raise a ticket; they do not block a scheduled scan
