# Author: Mengty LIM
[defaults]
inventory              = inventories/dev/hosts.yml
roles_path             = roles:collections/ansible_collections
collections_path       = collections
host_key_checking      = True
retry_files_enabled    = False
stdout_callback        = yaml
callbacks_enabled      = profile_tasks, timer
interpreter_python     = auto_silent
forks                  = 20
timeout                = 30
display_skipped_hosts  = False
deprecation_warnings   = True

# Never write facts to a world-readable path; they contain host detail.
fact_caching           = jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout   = 3600

# Fail loudly on undefined variables rather than templating an empty string
# into a config file and shipping it.
error_on_undefined_vars = True

[privilege_escalation]
become        = False
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# Bastion hop — direct SSH to prod hosts is not permitted (docs/09-runbooks.md §3)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
control_path = /tmp/ansible-%%h-%%p-%%r

[persistent_connection]
command_timeout = 60
connect_timeout = 60
