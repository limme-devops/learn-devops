# Author: Mengty LIM
---
# Pin everything. An unpinned collection turns a routine run into an upgrade.
# Refresh deliberately:  ansible-galaxy install -r requirements.yml --force
collections:
  - name: community.general
    version: "9.4.0"
  - name: community.crypto
    version: "2.22.1"
  - name: community.hashi_vault
    version: "6.2.0"
  - name: community.postgresql
    version: "3.6.0"
  - name: ansible.posix
    version: "1.5.4"
  - name: containers.podman
    version: "1.15.4"
  - name: kubernetes.core
    version: "5.0.0"
  - name: prometheus.prometheus
    version: "0.15.0"

roles:
  # CIS hardening baselines maintained by the community; we layer our own
  # exceptions on top rather than forking them.
  - name: ansible-lockdown.rhel9_cis
    src: https://github.com/ansible-lockdown/RHEL9-CIS.git
    version: "1.3.0"
    scm: git
