---
haproxy_stats_port: 8404
haproxy_vip: "10.20.16.5"
haproxy_vrrp_router_id: 51
haproxy_vrrp_interface: ens192

app_name: payment-service
app_port: 8080

# TLS from the internal PKI, renewed automatically by vault-agent.
haproxy_cert_path: /etc/pki/tls/private/haproxy-bundle.pem

# Client certificate authentication for partner/inter-bank endpoints.
haproxy_mtls_enabled: false
haproxy_client_ca: /etc/pki/tls/certs/partner-ca.pem

haproxy_maxconn: 20000
haproxy_rate_limit_per_ip: 100 # requests per 10s window
