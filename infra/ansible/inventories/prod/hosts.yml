# Author: Mengty LIM
---
# Static skeleton. The actual host lists live in generated/ and are written by
# the Terraform pipeline (module outputs -> ansible_inventory). Never hand-edit
# host entries here: Terraform is the source of truth for what exists.
#
#   terraform -chdir=... output -json ansible_inventory \
#     | yq -P > inventories/prod/generated/hosts.yml
all:
  children:
    prod:
      children:
        loadbalancers:
          hosts: {} # populated from generated/lb.yml
        app_servers:
          hosts: {} # populated from generated/app.yml
        db_servers:
          hosts: {} # populated from generated/db.yml
        k8s_control_plane:
          hosts: {} # populated from generated/k8s.yml
        k8s_workers:
          children:
            k8s_workers_general: { hosts: {} }
            k8s_workers_data: { hosts: {} }
            k8s_workers_ingress: { hosts: {} }

    # Cross-cutting groups used by roles, not by Terraform.
    linux:
      children:
        loadbalancers: {}
        app_servers: {}
        db_servers: {}
        k8s_control_plane: {}
        k8s_workers: {}

    pci_scope:
      # Hosts in PCI scope get the stricter hardening profile and 7-year audit
      # log retention. Adding a host here has compliance consequences — review
      # with Security.
      children:
        app_servers: {}
        db_servers: {}
