# Author: Mengty LIM
---
# Take the current host out of the load balancer pool, gracefully.
# Included by deploy-app.yml and patch.yml so both use identical semantics.

- name: Drain {{ inventory_hostname_short }} from all load balancers
  community.general.haproxy:
    state: disabled
    host: "{{ inventory_hostname_short }}"
    backend: "{{ haproxy_backend | default(app_name ~ '_backend') }}"
    socket: /var/run/haproxy/admin.sock
    drain: true
    wait: true
    wait_interval: 2
    wait_retries: 30
  delegate_to: "{{ item }}"
  loop: "{{ groups['loadbalancers'] | default([]) }}"

- name: Wait for active sessions to drain
  ansible.builtin.wait_for:
    timeout: "{{ drain_grace_seconds | default(30) }}"

- name: Confirm the node is receiving no new traffic
  ansible.builtin.shell: >-
    set -o pipefail;
    echo "show stat" | socat stdio /var/run/haproxy/admin.sock
    | awk -F, '$2 == "{{ inventory_hostname_short }}" {print $5}'
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['loadbalancers'][0] }}"
  register: session_count
  until: session_count.stdout | default('0') | int == 0
  retries: 10
  delay: 5
  changed_when: false
  failed_when: false
